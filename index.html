<body>
<div id="app"></div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyCrgMfdn79JOKx4XKA4hNwNZkhNACoizT4",
  authDomain:"restart-challenge-2026.firebaseapp.com",
  databaseURL:"https://restart-challenge-2026-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"restart-challenge-2026",
  storageBucket:"restart-challenge-2026.firebasestorage.app",
  messagingSenderId:"477447792834",
  appId:"1:477447792834:web:c657ca4d3e612d1ccf335b"
});
var DB = firebase.database();
var CL_CLOUD  = "dv2dmadr9";
var CL_PRESET = "restart_challenge";
var ADMIN_PW  = "jimmy0117";
var TOTAL     = 28;
var A_START   = "2026-06-01";
var A_END     = "2026-06-28";

// 台灣時間
function twToday(){
  var tw=new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Taipei"}));
  return tw.getFullYear()+"-"+pad(tw.getMonth()+1)+"-"+pad(tw.getDate());
}
function pad(n){return String(n).padStart(2,"0");}
function actDay(){
  var tw=new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Taipei"}));
  var d=Math.floor((tw-new Date("2026-06-01T00:00:00"))/86400000);
  return(d>=0&&d<TOTAL)?d+1:null;
}

// 狀態
var S={tab:"submit",teams:{},records:{},adminOk:false,adminPw:"",
  p1:null,p2:null,p3:null,p4:null,
  sel:"",smsg:"",busy:false,
  et:{member:"",from:"",to:""},emsg:"",
  ctm:null,ntn:"",nmi:{},tmOpen:false};

// Firebase 監聽
DB.ref("teams").on("value",function(s){S.teams=s.val()||{};R();});
DB.ref("records").on("value",function(s){S.records=s.val()||{};R();});

// 計算
function mdays(m){
  var r=S.records[m]||{};
  return Object.keys(r).filter(function(d){return d>=A_START&&d<=A_END;}).length;
}
function tmin(t){
  var mb=S.teams[t]||[];
  if(!mb.length)return 0;
  return Math.min.apply(null,mb.map(mdays));
}
function allMb(){
  return Object.entries(S.teams).flatMap(function(e){
    return(e[1]||[]).map(function(m){return{name:m,team:e[0]};});
  });
}
function gPct(){
  var a=allMb();if(!a.length)return 0;
  return a.reduce(function(x,m){return x+mdays(m.name);},0)/(a.length*TOTAL)*100;
}

// Cloudinary
async function upPhoto(file){
  var fd=new FormData();
  fd.append("file",file);fd.append("upload_preset",CL_PRESET);
  var r=await fetch("https://api.cloudinary.com/v1_1/"+CL_CLOUD+"/image/upload",{method:"POST",body:fd});
  var d=await r.json();
  if(!d.secure_url)throw new Error(d.error&&d.error.message||"上傳失敗");
  return d.secure_url;
}

// 提交
async function doSubmit(){
  var today=twToday();
  if(!S.sel)return sm("⚠️ 請選擇姓名");
  if(!S.p1||!S.p2||!S.p3||!S.p4)return sm("⚠️ 四張照片都要上傳！");
  if(S.records[S.sel]&&S.records[S.sel][today])return sm("⚠️ 今天已提交過囉！");
  S.busy=true;sm("上傳中，請稍候⋯");
  try{
    var urls=await Promise.all([upPhoto(S.p1),upPhoto(S.p2),upPhoto(S.p3),upPhoto(S.p4)]);
    await DB.ref("records/"+S.sel+"/"+today).set({ts:new Date().toISOString(),photo1:urls[0],photo2:urls[1],photo3:urls[2],photo4:urls[3]});
    S.p1=S.p2=S.p3=S.p4=null;sm("🎉 任務完成！打倒今日怪物！");
  }catch(e){sm("❌ 上傳失敗："+e.message);}
  S.busy=false;R();
}
function sm(m){S.smsg=m;R();}

// 移動日期
async function doMove(){
  var m=S.et.member,f=S.et.from,t=S.et.to;
  if(!m||!f||!t)return em("⚠️ 請填寫完整欄位");
  if(f===t)return em("⚠️ 來源與目標日期相同");
  var rec=(S.records[m]||{})[f];
  if(!rec)return em("⚠️ 該成員在來源日期沒有紀錄");
  if((S.records[m]||{})[t])return em("⚠️ 目標日期已有紀錄");
  await DB.ref("records/"+m+"/"+t).set(Object.assign({},rec,{adminMoved:true,movedAt:new Date().toISOString()}));
  await DB.ref("records/"+m+"/"+f).remove();
  em("✅ 已將 "+m+" 的 "+f+" 移至 "+t);
  S.et={member:"",from:"",to:""};
}
function em(m){S.emsg=m;R();}

// 刪除紀錄
async function delRec(m,d){
  await DB.ref("records/"+m+"/"+d).remove();
}

// 隊伍管理
async function saveTm(d){await DB.ref("teams").set(d);}
async function addTeam(){
  var n=S.ntn.trim();if(!n||S.teams[n])return;
  var nx=Object.assign({},S.teams);nx[n]=[];
  await saveTm(nx);S.ntn="";R();
}
async function addMember(team){
  var n=(S.nmi[team]||"").trim();
  if(!n||(S.teams[team]||[]).indexOf(n)>-1)return;
  var nx=Object.assign({},S.teams);
  nx[team]=(nx[team]||[]).concat(n);
  await saveTm(nx);S.nmi[team]="";R();
}
async function delMember(team,m){
  var nx=Object.assign({},S.teams);
  nx[team]=nx[team].filter(function(x){return x!==m;});
  await saveTm(nx);
}
async function delTeam(){
  var t=S.ctm;if(!t)return;
  var nx=Object.assign({},S.teams);delete nx[t];
  await saveTm(nx);S.ctm=null;R();
}
function doLogin(){
  if(S.adminPw===ADMIN_PW){S.adminOk=true;R();}
  else alert("密碼錯誤");
}

function e(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

// ══ 事件綁定 ══
function bind(){
  // 分頁
  ["submit","view","admin"].forEach(function(k){
    var el=document.getElementById("tab_"+k);
    if(el)el.addEventListener("click",function(){S.tab=k;R();});
  });
  // 成員選單
  var ms=document.getElementById("memSel");
  if(ms)ms.addEventListener("change",function(){S.sel=this.value;S.smsg="";R();});
  // 照片上傳
  ["p1","p2","p3","p4"].forEach(function(k){
    var ub=document.getElementById("ub_"+k);
    var fi=document.getElementById("fi_"+k);
    var rm=document.getElementById("rm_"+k);
    if(ub&&fi){
      ub.addEventListener("click",function(){fi.click();});
      fi.addEventListener("change",function(){
        if(this.files[0]){S[k]=this.files[0];R();}
      });
    }
    if(rm)rm.addEventListener("click",function(){S[k]=null;R();});
  });
  // 提交
  var sb=document.getElementById("submitBtn");
  if(sb)sb.addEventListener("click",doSubmit);
  // 管理員登入
  var pw=document.getElementById("pwIn");
  var lb=document.getElementById("loginBtn");
  if(pw)pw.addEventListener("input",function(){S.adminPw=this.value;});
  if(pw)pw.addEventListener("keydown",function(e){if(e.key==="Enter")doLogin();});
  if(lb)lb.addEventListener("click",doLogin);
  // 隊伍管理 toggle
  var tt=document.getElementById("tmTogBtn");
  if(tt)tt.addEventListener("click",function(){S.tmOpen=!S.tmOpen;R();});
  // 新增隊伍
  var ntn=document.getElementById("ntnIn");
  var atb=document.getElementById("addTeamBtn");
  if(ntn){
    ntn.addEventListener("input",function(){S.ntn=this.value;});
    ntn.addEventListener("keydown",function(ev){if(ev.key==="Enter"){S.ntn=ntn.value;addTeam();}});
  }
  if(atb)atb.addEventListener("click",function(){S.ntn=document.getElementById("ntnIn")?document.getElementById("ntnIn").value:S.ntn;addTeam();});
  // 新增成員（所有 nmi_ 前綴）
  Object.keys(S.teams).forEach(function(team){
    var inp=document.getElementById("nmi_"+team);
    if(inp){
      inp.addEventListener("input",function(){S.nmi[team]=this.value;});
      inp.addEventListener("keydown",function(ev){
        if(ev.key==="Enter"){S.nmi[team]=inp.value;addMember(team);}
      });
    }
  });
  // 新增成員按鈕
  document.querySelectorAll("[data-addmb]").forEach(function(btn){
    btn.addEventListener("click",function(){
      var team=this.dataset.addmb;
      var inp=document.getElementById("nmi_"+team);
      if(inp)S.nmi[team]=inp.value;
      addMember(team);
    });
  });
  // 刪除成員
  document.querySelectorAll("[data-delmb-team]").forEach(function(btn){
    btn.addEventListener("click",function(){delMember(this.dataset.delmbTeam,this.dataset.delmbM);});
  });
  // 刪除整隊
  document.querySelectorAll("[data-delteam]").forEach(function(btn){
    btn.addEventListener("click",function(){S.ctm=this.dataset.delteam;R();});
  });
  var dy=document.getElementById("delTeamYes");
  var dn=document.getElementById("delTeamNo");
  if(dy)dy.addEventListener("click",delTeam);
  if(dn)dn.addEventListener("click",function(){S.ctm=null;R();});
  // 移動日期
  var etm=document.getElementById("etM");
  var etf=document.getElementById("etF");
  var ett=document.getElementById("etT");
  var mvb=document.getElementById("moveBtn");
  if(etm)etm.addEventListener("change",function(){S.et.member=this.value;});
  if(etf)etf.addEventListener("change",function(){S.et.from=this.value;});
  if(ett)ett.addEventListener("change",function(){S.et.to=this.value;});
  if(mvb)mvb.addEventListener("click",doMove);
  // 刪除打卡紀錄
  document.querySelectorAll("[data-delrec-m]").forEach(function(btn){
    btn.addEventListener("click",function(){delRec(this.dataset.delrecM,this.dataset.delrecD);});
  });
}

</script>
