<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>重啟行動力 1-1-1-1</title>

<!-- Firebase compat（傳統模式，不需要 import，全域直接用）-->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
</head>
<body>
<div id="app">
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:16px;background:#0a0a14">
    <div style="font-size:64px;animation:bounce .6s infinite alternate">👾</div>
    <div style="font-size:20px;color:#6b6b8a;font-family:sans-serif">載入戰場中...</div>
  </div>
</div>
<style>@keyframes bounce{to{transform:translateY(-12px)}}</style>

<script>
// ══════════════════════════════
//  Firebase 設定
// ══════════════════════════════
firebase.initializeApp({
  apiKey:            "AIzaSyCrgMfdn79JOKx4XKA4hNwNZkhNACoizT4",
  authDomain:        "restart-challenge-2026.firebaseapp.com",
  databaseURL:       "https://restart-challenge-2026-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:         "restart-challenge-2026",
  storageBucket:     "restart-challenge-2026.firebasestorage.app",
  messagingSenderId: "477447792834",
  appId:             "1:477447792834:web:c657ca4d3e612d1ccf335b"
});
const db = firebase.database();

// ══════════════════════════════
//  Cloudinary 設定
// ══════════════════════════════
const CLOUDINARY_CLOUD  = "dv2dmadr9";
const CLOUDINARY_PRESET = "restart_challenge";

// ══════════════════════════════
//  常數
// ══════════════════════════════
const ADMIN_PW        = "jimmy0117";
const TOTAL_DAYS      = 28;
const ACT_START       = "2026-06-01";
const ACT_END         = "2026-06-28";
const PERSONAL_REWARD = { days:21, icon:"💰", label:"拿回報名費100元", color:"#7c3aed" };
const TEAM_REWARD     = { days:21, icon:"🥩", label:"免費吃我家牛排！", color:"#b91c1c" };

// ══════════════════════════════
//  台灣時間
// ══════════════════════════════
function getTWToday() {
  const tw = new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Taipei"}));
  return `${tw.getFullYear()}-${String(tw.getMonth()+1).padStart(2,"0")}-${String(tw.getDate()).padStart(2,"0")}`;
}
function getActivityDay() {
  const tw    = new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Taipei"}));
  const start = new Date("2026-06-01T00:00:00");
  const diff  = Math.floor((tw - start) / 86400000);
  return (diff >= 0 && diff < TOTAL_DAYS) ? diff + 1 : null;
}

// ══════════════════════════════
//  全域狀態
// ══════════════════════════════
var S = {
  tab:"submit", teams:{}, records:{},
  adminUnlocked:false, adminPw:"",
  photos:{ photo1:null, photo2:null, photo3:null, photo4:null },
  selMember:"", submitMsg:"", submitting:false,
  editTarget:{ member:"", fromDate:"", toDate:"" }, editMsg:"",
  confirmTeam:null, newTeamName:"", newMemberInputs:{}, teamMgrOpen:false,
};

// ══════════════════════════════
//  Firebase 監聽
// ══════════════════════════════
db.ref("teams").on("value", snap => {
  S.teams = snap.val() || {};
  render();
});
db.ref("records").on("value", snap => {
  S.records = snap.val() || {};
  render();
});

// ══════════════════════════════
//  計算函式
// ══════════════════════════════
function memberDays(member) {
  const rec = S.records[member] || {};
  return Object.keys(rec).filter(d => d >= ACT_START && d <= ACT_END).length;
}
function teamMinDays(team) {
  const mbs = S.teams[team] || [];
  if (!mbs.length) return 0;
  return Math.min.apply(null, mbs.map(m => memberDays(m)));
}
function allMembers() {
  return Object.entries(S.teams).flatMap(([t,mbs]) => (mbs||[]).map(m => ({name:m,team:t})));
}
function globalProgress() {
  const all = allMembers();
  if (!all.length) return 0;
  return (all.reduce((a,m) => a + memberDays(m.name), 0) / (all.length * TOTAL_DAYS)) * 100;
}

// ══════════════════════════════
//  Cloudinary 上傳
// ══════════════════════════════
async function uploadPhoto(file) {
  const fd = new FormData();
  fd.append("file", file);
  fd.append("upload_preset", CLOUDINARY_PRESET);
  const res  = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`, {method:"POST",body:fd});
  const data = await res.json();
  if (!data.secure_url) throw new Error(data.error?.message || "上傳失敗");
  return data.secure_url;
}

// ══════════════════════════════
//  提交任務
// ══════════════════════════════
async function handleSubmit() {
  const today = getTWToday();
  if (!S.selMember) return showMsg("⚠️ 請選擇姓名");
  if (!S.photos.photo1||!S.photos.photo2||!S.photos.photo3||!S.photos.photo4)
    return showMsg("⚠️ 四張照片都要上傳才能完成任務！");
  if (S.records[S.selMember]?.[today]) return showMsg("⚠️ 今天已提交過囉！");
  S.submitting = true; showMsg("上傳中，請稍候⋯"); render();
  try {
    const [u1,u2,u3,u4] = await Promise.all([
      uploadPhoto(S.photos.photo1), uploadPhoto(S.photos.photo2),
      uploadPhoto(S.photos.photo3), uploadPhoto(S.photos.photo4),
    ]);
    await db.ref(`records/${S.selMember}/${today}`).set({
      ts: new Date().toISOString(), photo1:u1, photo2:u2, photo3:u3, photo4:u4
    });
    S.photos = {photo1:null,photo2:null,photo3:null,photo4:null};
    showMsg("🎉 任務完成！打倒今日怪物！");
  } catch(e) { showMsg("❌ 上傳失敗：" + e.message); }
  S.submitting = false; render();
}
function showMsg(m){ S.submitMsg=m; render(); }

// ══════════════════════════════
//  管理員：移動日期
// ══════════════════════════════
async function handleMoveDate() {
  const {member,fromDate,toDate} = S.editTarget;
  if (!member||!fromDate||!toDate) return showEditMsg("⚠️ 請填寫完整欄位");
  if (fromDate===toDate) return showEditMsg("⚠️ 來源與目標日期相同");
  const rec = (S.records[member]||{})[fromDate];
  if (!rec) return showEditMsg("⚠️ 該成員在來源日期沒有紀錄");
  if ((S.records[member]||{})[toDate]) return showEditMsg("⚠️ 目標日期已有紀錄");
  await db.ref(`records/${member}/${toDate}`).set({...rec, adminMoved:true, movedAt:new Date().toISOString()});
  await db.ref(`records/${member}/${fromDate}`).remove();
  showEditMsg(`✅ 已將 ${member} 的 ${fromDate} 移至 ${toDate}`);
  S.editTarget = {member:"",fromDate:"",toDate:""};
}
function showEditMsg(m){ S.editMsg=m; render(); }

// ══════════════════════════════
//  管理員：刪除紀錄
// ══════════════════════════════
async function handleDeleteRecord(member, date) {
  await db.ref(`records/${member}/${date}`).remove();
}

// ══════════════════════════════
//  隊伍管理
// ══════════════════════════════
async function saveTeams(data) {
  await db.ref("teams").set(data);
}
async function addTeam() {
  const name = S.newTeamName.trim();
  if (!name || S.teams[name]) return;
  const next = Object.assign({}, S.teams);
  next[name] = [];
  await saveTeams(next);
  S.newTeamName = ""; render();
}
async function addMember(team) {
  const name = (S.newMemberInputs[team]||"").trim();
  if (!name||(S.teams[team]||[]).includes(name)) return;
  const next = Object.assign({}, S.teams);
  next[team] = [...(next[team]||[]), name];
  await saveTeams(next);
  S.newMemberInputs[team] = ""; render();
}
async function deleteMember(team, member) {
  const next = Object.assign({}, S.teams);
  next[team] = next[team].filter(m => m !== member);
  await saveTeams(next);
}
async function confirmDeleteTeam() {
  const t = S.confirmTeam; if (!t) return;
  const next = Object.assign({}, S.teams);
  delete next[t];
  await saveTeams(next);
  S.confirmTeam = null; render();
}

// ══════════════════════════════
//  RENDER
// ══════════════════════════════
function render() {
  document.getElementById("app").innerHTML = buildHTML();
}

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function buildHTML() {
  var today  = getTWToday();
  var actDay = getActivityDay();
  var bossHP = Math.max(0, 100 - globalProgress());
  var bossColor = bossHP > 60 ? "#e74c3c" : bossHP > 30 ? "#e67e22" : "#2ecc71";

  // 分頁按鈕
  var tabs = ["submit|⚔️ 提交任務","view|📊 查看進度","admin|🔑 管理員"].map(function(t){
    var p=t.split("|"); return '<button class="tab-btn'+(S.tab===p[0]?" active":"")+'" onclick="S.tab=\''+p[0]+'\';render()">'+p[1]+'</button>';
  }).join("");

  var content = S.tab==="submit" ? buildSubmit(today)
              : S.tab==="view"   ? buildView()
              : buildAdmin();

  return '<div class="bg-grid"></div>'
    +'<header class="hero">'
    +'<div class="hero-badge">⚔️ 21天打怪挑戰</div>'
    +'<h1 class="hero-title">重啟行動力<br><span class="hero-sub">1 · 1 · 1 · 1</span></h1>'
    +'<p class="hero-desc">6/1 – 6/28｜3人同行 21天｜完成任務 免費🥩請你吃</p>'
    +'<div class="monster-hp"><div class="monster-emoji">👾</div>'
    +'<div class="hp-track"><div class="hp-fill" style="width:'+Math.round(bossHP)+'%;background:'+bossColor+'"></div></div>'
    +'<div class="hp-label">Boss HP '+Math.round(bossHP)+'%</div></div>'
    +'<div class="hero-day">'+(actDay?'🗡️ 活動第 '+actDay+' 天 / '+TOTAL_DAYS+' 天':'活動期間：6/1 – 6/28')+'</div>'
    +'</header>'
    +'<nav class="tabs">'+tabs+'</nav>'
    +'<main class="main">'+content+'</main>'
    +'<footer class="footer">重啟行動力 1-1-1-1 ｜ 香綺大C ⚔️</footer>';
}

// ── 提交任務 ──
function buildSubmit(today) {
  var already = S.records[S.selMember] && S.records[S.selMember][today];
  var opts = Object.entries(S.teams).map(function(e){
    var team=e[0], mbs=e[1]||[];
    return '<optgroup label="'+esc(team)+'">'+mbs.map(function(m){
      return '<option value="'+esc(m)+'"'+(m===S.selMember?' selected':'')+'>'+esc(m)+'</option>';
    }).join("")+'</optgroup>';
  }).join("");

  var photoBoxes = [
    {key:"photo1",label:"新增群友",icon:"👥"},
    {key:"photo2",label:"暖群友",icon:"🔥"},
    {key:"photo3",label:"市調",icon:"📋"},
    {key:"photo4",label:"使用產品",icon:"🌿"},
  ].map(function(p){ return photoBox(p.key,p.label,p.icon); }).join("");

  return '<div class="panel">'
    +'<div class="panel-title">⚔️ 今日任務上傳</div>'
    +'<div class="date-badge">📅 台灣時間今日：'+today+'</div>'
    +'<div class="field"><label class="field-label">👤 選擇你的名字</label>'
    +'<select class="select" onchange="S.selMember=this.value;S.submitMsg=\'\';render()">'
    +'<option value="">── 請選擇 ──</option>'+opts+'</select></div>'
    +(S.selMember && already ? '<div class="already-done">✅ '+esc(S.selMember)+' 今天已完成任務！明天繼續打怪💪</div>' : '')
    +(S.selMember && !already ? '<div class="tasks-grid">'+photoBoxes+'</div>'
      +'<div class="task-hint">💡 市調：居家購物清單 · 強連結 · 商展 · 評估　｜　🌿 使用產品：放群組照片或影片＋寫下感受</div>'
      +'<button class="submit-btn'+(S.submitting?' loading':'')+'" onclick="handleSubmit()" '+(S.submitting?'disabled':'')+'>'+( S.submitting?'上傳中...':'⚔️ 完成今日任務！打怪！')+'</button>'
      +(S.submitMsg?'<div class="msg '+(S.submitMsg.startsWith('🎉')?'success':'error')+'">'+esc(S.submitMsg)+'</div>':'')
    : '')
    +'</div>';
}

function photoBox(key,label,icon) {
  var val = S.photos[key];
  if (val) {
    var src = (val instanceof File) ? URL.createObjectURL(val) : val;
    return '<div class="upload-box uploaded">'
      +'<div class="preview-wrap"><img src="'+src+'" class="preview-img"/>'
      +'<div class="preview-badge">✅ '+label+'</div>'
      +'<button class="remove-btn" onclick="S.photos[\''+key+'\']=null;render()">✕</button>'
      +'</div></div>';
  }
  return '<div class="upload-box" onclick="document.getElementById(\'f_'+key+'\').click()">'
    +'<div class="upload-placeholder">'
    +'<span class="upload-icon">'+icon+'</span>'
    +'<span class="upload-label">'+label+'</span>'
    +'<span class="upload-hint">點擊上傳照片</span>'
    +'</div>'
    +'<input type="file" id="f_'+key+'" accept="image/*" style="display:none" '
    +'onchange="var f=this.files[0];if(f){S.photos[\''+key+'\']=f;render()}">'
    +'</div>';
}

// ── 查看進度 ──
function buildView() {
  if (!Object.keys(S.teams).length)
    return '<div class="panel"><div class="panel-title">📊 戰況總覽</div>'
      +'<div style="color:var(--muted);text-align:center;padding:40px">尚未設定隊伍，請管理員新增</div></div>';

  var blocks = Object.entries(S.teams).map(function(e){
    var team=e[0], mbs=e[1]||[];
    var minDays = teamMinDays(team);
    var minPct  = Math.min((minDays/21)*100,100);
    var bossHPpct = Math.max(0,100-(minDays/21)*100);
    var bossColor = minDays>=21?"#2ecc71":minDays>=14?"#e67e22":"#e74c3c";
    var teamUnlocked = minDays>=21;

    var cards = mbs.map(function(member){
      var days = memberDays(member);
      var pct  = (days/TOTAL_DAYS)*100;
      var earned = days>=21;
      var dots = "";
      for(var i=0;i<TOTAL_DAYS;i++){
        var d=new Date("2026-06-01"); d.setDate(d.getDate()+i);
        var k=d.toISOString().split("T")[0];
        var done = S.records[member] && S.records[member][k];
        dots += '<div class="day-dot'+(done?' done':'')+'" title="第'+(i+1)+'天 '+k+'"></div>';
      }
      return '<div class="member-card">'
        +'<div class="member-name">'+esc(member)+'</div>'
        +'<div class="member-days-row-card">'
        +'<span class="member-days">'+days+' / '+TOTAL_DAYS+' 天</span>'
        +'<span class="personal-reward-tag'+(earned?' earned':'')+'">'+
          (earned?'✅ 💰 報名費已達標':'🔒 還差'+(21-days)+'天拿回100元')
        +'</span></div>'
        +'<div class="progress-wrap"><div class="progress-track">'
        +'<div class="progress-fill" style="width:'+pct+'%;background:#22d3ee"></div>'
        +'<span class="progress-pct">'+Math.round(pct)+'%</span>'
        +'</div></div>'
        +'<div class="day-dots">'+dots+'</div>'
        +'</div>';
    }).join("");

    return '<div class="team-block">'
      +'<div class="team-header"><span class="team-name">'+esc(team)+'</span>'
      +'<span class="team-min-days">全隊最低 '+minDays+' 天</span></div>'
      +'<div class="team-monster-hp"><span class="team-monster-emoji">👾</span>'
      +'<div class="team-hp-track"><div class="team-hp-fill" style="width:'+Math.round(bossHPpct)+'%;background:'+bossColor+'"></div></div>'
      +'<span class="team-hp-label">Boss HP '+Math.round(bossHPpct)+'%</span></div>'
      +'<div class="reward-banner-wrap">'
      +'<div class="milestone-bar-wrap"><div class="milestone-track">'
      +'<div class="milestone-fill" style="width:'+minPct+'%"></div>'
      +'<div class="milestone-marker'+(minDays>=21?' reached':'')+'" style="left:100%;border-color:'+TEAM_REWARD.color+'"><span class="ms-icon">'+TEAM_REWARD.icon+'</span></div>'
      +'</div><div class="milestone-labels" style="height:28px">'
      +'<div class="ms-label'+(minDays>=21?' reached':'')+'" style="left:100%;color:'+TEAM_REWARD.color+'">21天<br>'+TEAM_REWARD.icon+TEAM_REWARD.label+'</div>'
      +'</div></div>'
      +'<div class="team-reward-badge'+(teamUnlocked?' unlocked':' locked')+'"'
      +(teamUnlocked?' style="border-color:'+TEAM_REWARD.color+';color:'+TEAM_REWARD.color+';background:'+TEAM_REWARD.color+'18"':'')+'>'
      +(teamUnlocked?'✅ 全隊達標！'+TEAM_REWARD.icon+' '+TEAM_REWARD.label
        :'🔒 全隊都完成21天 → '+TEAM_REWARD.icon+' '+TEAM_REWARD.label+'（還差'+(21-minDays)+'天）')
      +'</div></div>'
      +'<div class="members-grid">'+cards+'</div>'
      +'</div>';
  }).join("");

  return '<div class="panel"><div class="panel-title">📊 戰況總覽</div>'+blocks+'</div>';
}

// ── 管理員 ──
function buildAdmin() {
  if (!S.adminUnlocked) return '<div class="panel">'
    +'<div class="panel-title">🔑 管理員審核</div>'
    +'<div class="admin-login">'
    +'<input type="password" class="select" placeholder="輸入管理員密碼" '
    +'id="adminPwInput"'>'
    +'<button class="submit-btn" onclick="doAdminLogin()">解鎖</button>'
    +'</div></div>';

  var all = allMembers();
  var totalCI = all.reduce(function(a,m){return a+memberDays(m.name);},0);

  // 排名圖表
  var teamData = Object.entries(S.teams).map(function(e){
    var team=e[0], mbs=e[1]||[];
    var tot=mbs.reduce(function(a,m){return a+memberDays(m);},0);
    var min=mbs.length?Math.min.apply(null,mbs.map(function(m){return memberDays(m);})):0;
    return {team:team,members:mbs,totalDays:tot,minDays:min,avgDays:mbs.length?tot/mbs.length:0};
  }).sort(function(a,b){return b.totalDays-a.totalDays;});
  var maxTotal = Math.max.apply(null, teamData.map(function(t){return t.totalDays;})||[1]);
  var medals=["🥇","🥈","🥉"];

  var rankBars = teamData.map(function(td,i){
    var bg=i===0?"linear-gradient(90deg,#f5a623,#f0532a)":i===1?"linear-gradient(90deg,#a855f7,#6366f1)":"linear-gradient(90deg,#22d3ee,#06b6d4)";
    return '<div class="rank-row"><div class="rank-medal">'+(medals[i]||"#"+(i+1))+'</div>'
      +'<div class="rank-team-name">'+esc(td.team)+'</div>'
      +'<div class="rank-bar-wrap"><div class="rank-bar" style="width:'+(maxTotal?Math.round(td.totalDays/maxTotal*100):0)+'%;background:'+bg+'"></div>'
      +'<span class="rank-bar-num">'+td.totalDays+' 天</span></div></div>';
  }).join("");

  var rankRows = teamData.map(function(td,i){
    var ul=[PERSONAL_REWARD,TEAM_REWARD].filter(function(ms){return td.minDays>=ms.days;});
    return '<div class="rank-table-row'+(i===0?' rank-first':'')+'">'
      +'<span>'+(medals[i]||"#"+(i+1))+' '+esc(td.team)+'</span>'
      +'<span class="rank-num">'+td.totalDays+'</span>'
      +'<span class="rank-num">'+td.avgDays.toFixed(1)+'</span>'
      +'<span class="rank-num">'+td.minDays+'</span>'
      +'<span>'+(ul.length?ul.map(function(ms){return '<span class="reward-chip">'+ms.icon+'</span>';}).join(""):'<span class="no-reward">—</span>')+'</span>'
      +'</div>';
  }).join("");

  var memberDayGroups = teamData.map(function(td){
    var sorted=[].concat(td.members).map(function(m){return {name:m,days:memberDays(m)};}).sort(function(a,b){return b.days-a.days;});
    var rows=sorted.map(function(m,mi){
      return '<div class="member-days-row">'
        +'<span class="member-days-rank">#'+(mi+1)+'</span>'
        +'<span class="member-days-name">'+esc(m.name)+'</span>'
        +'<div class="member-days-bar-wrap">'
        +'<div class="member-days-bar" style="width:'+(m.days/TOTAL_DAYS*100)+'%"></div>'
        +'<div class="member-days-milestone" style="left:'+(21/TOTAL_DAYS*100)+'%"></div>'
        +'</div><span class="member-days-num">'+m.days+' 天</span></div>';
    }).join("");
    return '<div class="member-days-group"><div class="member-days-team">'+esc(td.team)+'</div>'+rows+'</div>';
  }).join("");

  // 隊伍管理
  var teamCards = Object.entries(S.teams).map(function(e){
    var team=e[0], mbs=e[1]||[];
    var tags=mbs.map(function(m){
      return '<div class="team-mgmt-member-tag">'+esc(m)
        +'<button onclick="deleteMember(\''+esc(team)+'\',\''+esc(m)+'\')">✕</button></div>';
    }).join("");
    return '<div class="team-mgmt-card">'
      +'<div class="team-mgmt-header">'
      +'<span class="team-mgmt-name">'+esc(team)+'</span>'
      +'<span class="team-mgmt-count">'+mbs.length+' 人</span>'
      +'<button class="team-mgmt-del-team" onclick="S.confirmTeam=\''+esc(team)+'\';render()">🗑️ 刪除整隊</button>'
      +'</div><div class="team-mgmt-members">'+(tags||'<span style="color:var(--muted);font-size:12px">尚無成員</span>')+'</div>'
      +'<div class="team-mgmt-add-row">'
      +'<input class="select small" placeholder="輸入成員姓名" '
      +'value="'+(S.newMemberInputs[team]||"")+'" '
      +'data-member-input="\'+esc(team)+\'"\n'
      +'<button class="move-btn" onclick="addMember(\''+esc(team)+'\')">＋ 新增</button>'
      +'</div></div>';
  }).join("");

  var confirmDialog = S.confirmTeam
    ? '<div class="confirm-dialog"><span>確定刪除「'+esc(S.confirmTeam)+'」整隊？</span>'
      +'<div class="confirm-btns">'
      +'<button class="confirm-yes" onclick="confirmDeleteTeam()">確定刪除</button>'
      +'<button class="confirm-no" onclick="S.confirmTeam=null;render()">取消</button>'
      +'</div></div>' : "";

  // 審核
  var reviews = all.map(function(m){
    var rec=S.records[m.name]||{};
    var dates=Object.keys(rec).sort();
    if(!dates.length) return "";
    var dayRows=dates.map(function(date){
      var r=rec[date];
      var photos=[
        {key:"photo1",label:"👥 新增群友"},{key:"photo2",label:"🔥 暖群友"},
        {key:"photo3",label:"📋 市調"},{key:"photo4",label:"🌿 使用產品"}
      ].map(function(p){
        return '<div class="admin-photo-wrap"><div class="admin-photo-label">'+p.label+'</div>'
          +(r[p.key]?'<a href="'+r[p.key]+'" target="_blank"><img src="'+r[p.key]+'" class="admin-photo"/></a>'
            :'<div class="admin-no-photo">未上傳</div>')+'</div>';
      }).join("");
      return '<div class="admin-day"><div class="admin-date-row"><span>📅 '+date+'</span>'
        +(r.adminMoved?'<span class="moved-badge">已移動</span>':'')
        +'<button class="delete-btn" onclick="handleDeleteRecord(\''+esc(m.name)+'\',\''+date+'\')">🗑️ 刪除</button>'
        +'</div><div class="admin-photos">'+photos+'</div></div>';
    }).join("");
    return '<details class="admin-member">'
      +'<summary class="admin-member-title">'+esc(m.name)
      +' <span class="admin-team-tag">'+esc(m.team)+'</span>'
      +'<span class="admin-count">'+dates.length+' 天</span></summary>'+dayRows+'</details>';
  }).join("");

  var memberOpts = Object.entries(S.teams).map(function(e){
    return '<optgroup label="'+esc(e[0])+'">'+( e[1]||[]).map(function(m){
      return '<option value="'+esc(m)+'"'+(m===S.editTarget.member?' selected':'')+'>'+esc(m)+'</option>';
    }).join("")+'</optgroup>';
  }).join("");

  return '<div class="panel"><div class="panel-title">🔑 管理員審核</div><div class="admin-panel">'
    // 統計
    +'<div class="admin-stats">'
    +'<div class="stat-card"><div class="stat-num">'+all.length+'</div><div class="stat-lbl">總成員</div></div>'
    +'<div class="stat-card"><div class="stat-num">'+totalCI+'</div><div class="stat-lbl">總打卡次數</div></div>'
    +'<div class="stat-card"><div class="stat-num">'+Math.round(globalProgress())+'%</div><div class="stat-lbl">全體完成率</div></div>'
    +'</div>'
    // 排名圖表
    +'<div class="chart-section"><div class="section-title">🏆 隊伍排名（總打卡天數）</div>'
    +'<div class="rank-chart">'+rankBars+'</div>'
    +'<div class="rank-table"><div class="rank-table-head"><span>隊伍</span><span>總天數</span><span>平均</span><span>最低</span><span>獎勵</span></div>'+rankRows+'</div>'
    +'<div class="section-title" style="margin-top:20px">👤 各成員完成天數</div>'+memberDayGroups+'</div>'
    // 隊伍管理
    +'<div class="team-mgmt-section">'
    +'<button class="team-mgmt-toggle" onclick="S.teamMgrOpen=!S.teamMgrOpen;render()">👥 隊伍與成員管理 '+(S.teamMgrOpen?'▲':'▼')+'</button>'
    +(S.teamMgrOpen?'<div class="team-mgmt-body">'+confirmDialog+teamCards
      +'<div class="team-mgmt-new-team"><div class="field-label">新增隊伍</div>'
      +'<div class="team-mgmt-add-row">'
      +'<input class="select small" placeholder="隊伍名稱（例如：🐉 龍隊）" value="'+esc(S.newTeamName)+'" '
      +'id="newTeamInput"'>'
      +'<button class="move-btn" onclick="addTeam()">＋ 建立隊伍</button>'
      +'</div></div></div>':'')
    +'</div>'
    // 移動日期
    +'<div class="admin-move-section"><div class="section-title">🗓️ 移動紀錄日期</div>'
    +'<div class="admin-move-grid">'
    +'<div><div class="field-label">成員</div>'
    +'<select class="select small" id="etMember">'
    +'<option value="">請選擇</option>'+memberOpts+'</select></div>'
    +'<div><div class="field-label">來源日期</div>'
    +'<input type="date" class="select small" value="'+S.editTarget.fromDate+'" id="etFrom"></div>'
    +'<div><div class="field-label">移至日期</div>'
    +'<input type="date" class="select small" value="'+S.editTarget.toDate+'" id="etTo"></div>'
    +'<div class="move-btn-wrap"><button class="move-btn" onclick="handleMoveDate()">移動</button></div>'
    +'</div>'
    +(S.editMsg?'<div class="msg '+(S.editMsg.startsWith('✅')?'success':'error')+'" style="margin-top:8px">'+esc(S.editMsg)+'</div>':'')
    +'</div>'
    // 逐人審核
    +'<div class="section-title">📷 逐人審核</div>'
    +(reviews||'<div style="color:var(--muted);font-size:13px;padding:20px 0">目前無人打卡</div>')
    +'</div></div>';
}

function doAdminLogin() {
  if (S.adminPw === ADMIN_PW) { S.adminUnlocked=true; render(); }
  else { alert("密碼錯誤"); }
}

// 每次 render 後重新綁定所有輸入事件
function bindEvents() {
  // 管理員密碼
  var pwInput = document.getElementById("adminPwInput");
  if (pwInput) {
    pwInput.value = S.adminPw;
    pwInput.addEventListener("input", function(){ S.adminPw = this.value; });
    pwInput.addEventListener("keydown", function(e){ if(e.key==="Enter") doAdminLogin(); });
  }
  // 新增隊伍輸入
  var ntInput = document.getElementById("newTeamInput");
  if (ntInput) {
    ntInput.value = S.newTeamName;
    ntInput.addEventListener("input", function(){ S.newTeamName = this.value; });
    ntInput.addEventListener("keydown", function(e){ if(e.key==="Enter") addTeam(); });
  }
  // 成員選單
  var selEl = document.getElementById("memberSelect");
  if (selEl) {
    selEl.addEventListener("change", function(){ S.selMember=this.value; S.submitMsg=""; render(); });
  }
  // 新增成員輸入（多個隊）
  document.querySelectorAll("[data-member-input]").forEach(function(el){
    var team = el.dataset.memberInput;
    el.value = S.newMemberInputs[team] || "";
    el.addEventListener("input", function(){ S.newMemberInputs[team] = this.value; });
    el.addEventListener("keydown", function(e){ if(e.key==="Enter") addMember(team); });
  });
  // 移動日期欄位
  var etMember = document.getElementById("etMember");
  if (etMember) etMember.addEventListener("change", function(){ S.editTarget.member=this.value; });
  var etFrom = document.getElementById("etFrom");
  if (etFrom) etFrom.addEventListener("change", function(){ S.editTarget.fromDate=this.value; });
  var etTo = document.getElementById("etTo");
  if (etTo) etTo.addEventListener("change", function(){ S.editTarget.toDate=this.value; });
}

var _origRender = render;
render = function() { _origRender(); bindEvents(); };

// 初始 render
render();
</script>

.team-mgmt-body{margin-top:12px;display:flex;flex-direction:column;gap:12px}
.team-mgmt-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.team-mgmt-header{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.team-mgmt-name{font-weight:700;font-size:14px;flex:1}
.team-mgmt-count{font-size:11px;color:var(--muted);background:rgba(255,255,255,.06);padding:2px 8px;border-radius:6px}
.team-mgmt-del-team{background:rgba(231,76,60,.12);border:1px solid rgba(231,76,60,.3);color:var(--danger);padding:4px 10px;border-radius:6px;font-size:11px;cursor:pointer}
.team-mgmt-members{display:flex;flex-wrap:wrap;gap:8px;min-height:28px}
.team-mgmt-member-tag{display:flex;align-items:center;gap:6px;background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.25);color:var(--accent3);padding:4px 10px;border-radius:20px;font-size:13px}
.team-mgmt-member-tag button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;padding:0;line-height:1}
.team-mgmt-add-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.team-mgmt-new-team{background:rgba(245,166,35,.05);border:1px dashed rgba(245,166,35,.3);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.admin-move-section{background:rgba(245,166,35,.06);border:1px solid rgba(245,166,35,.2);border-radius:12px;padding:16px;margin-bottom:20px}
.admin-move-grid{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:12px}
.admin-move-grid>div{display:flex;flex-direction:column;gap:6px}.move-btn-wrap{justify-content:flex-end}
.move-btn{padding:9px 20px;background:linear-gradient(135deg,var(--accent),#f0532a);border:none;border-radius:8px;color:#fff;font-family:var(--font-body);font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
.admin-date-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:10px;flex-wrap:wrap}
.moved-badge{font-size:10px;background:rgba(245,166,35,.15);color:var(--accent);padding:2px 6px;border-radius:4px}
.delete-btn{margin-left:auto;background:rgba(231,76,60,.15);border:1px solid rgba(231,76,60,.3);color:var(--danger);padding:3px 10px;border-radius:6px;font-size:11px;cursor:pointer}
.admin-member{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden}
.admin-member-title{padding:12px 16px;cursor:pointer;font-weight:700;list-style:none;display:flex;align-items:center;gap:8px}
.admin-member-title::-webkit-details-marker{display:none}
.admin-team-tag{font-size:11px;color:var(--muted);font-weight:400}
.admin-count{margin-left:auto;font-size:12px;color:var(--accent3);background:rgba(34,211,238,.1);padding:2px 8px;border-radius:6px}
.admin-day{padding:12px 16px;border-top:1px solid var(--border)}
.admin-photos{display:flex;gap:12px;flex-wrap:wrap}
.admin-photo-wrap{flex:1;min-width:100px}.admin-photo-label{font-size:11px;color:var(--muted);margin-bottom:4px}
.admin-photo{width:100%;border-radius:6px;object-fit:cover;max-height:120px;display:block}
.admin-no-photo{background:rgba(255,255,255,.04);border:1px dashed var(--border);border-radius:6px;padding:20px;text-align:center;font-size:11px;color:var(--muted)}
.admin-panel{}
.footer{position:relative;z-index:1;text-align:center;padding:20px;font-size:12px;color:var(--muted);border-top:1px solid var(--border)}
</style>
</body>
</html>
